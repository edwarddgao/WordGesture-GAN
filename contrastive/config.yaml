data:
  data_dir: data/processed
  n_points: 128

features:
  use_key_proximity: true
  use_velocity: true
  key_proximity_sigma: 0.3

model:
  gesture_in_channels: 31  # 3 (x,y,dt) + 26 (key proximity) + 2 (velocity)
  embedding_dim: 64
  projection_dim: 128

contrastive:
  temperature: 0.07
  learnable_temp: true

training:
  batch_size: 512
  lr: 0.0002
  lr_temp: 0.001
  weight_decay: 1.0e-4
  epochs: 200
  checkpoint_dir: contrastive/checkpoints
  checkpoint_every: 10

augmentation:
  enabled: true
  noise_std: 0.01
