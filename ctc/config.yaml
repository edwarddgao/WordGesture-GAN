data:
  data_dir: data/processed
  n_points: 128
  key_proximity_sigma: 0.3

features:
  use_key_proximity: true
  use_velocity: true

model:
  hidden_size: 256
  num_layers: 2
  dropout: 0.2
  num_classes: 27  # 26 letters + blank

training:
  batch_size: 64
  lr: 0.001
  weight_decay: 1.0e-4
  epochs: 100
  checkpoint_dir: ctc/checkpoints
  checkpoint_every: 10
  grad_clip: 5.0

augmentation:
  enabled: true
  noise_std: 0.01
